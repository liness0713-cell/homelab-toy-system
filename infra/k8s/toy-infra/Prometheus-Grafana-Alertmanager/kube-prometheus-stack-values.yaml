# kube-prometheus-stack values - homelab精简版
# 完整默认values很长（几千行），这里只覆盖需要改动的部分，其余用chart默认值

# 两个密码都不写进文件，用 helm 命令行 --set / --set-string 传入：
#   grafana.adminPassword
#   alertmanager.config.global.smtp_auth_password
# 注意：helm 不会展开 ${VAR} 这种环境变量，文件里的占位符如果忘了 --set，
# 会被原样部署上去（Grafana 密码会变成占位符，邮件会发送失败）。

# --- Prometheus本体 ---
prometheus:
  prometheusSpec:
    retention: 7d              # homelab磁盘有限，默认15d改成7天，够用于练习排查
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path   # k3s默认自带的StorageClass，你P5就用过
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 10Gi }
    # 关键：默认这个chart只会抓"带release标签、且和release同namespace"的
    # ServiceMonitor，会导致你自己手写的ServiceMonitor被忽略。这两行放开限制，
    # 抓取范围覆盖所有namespace里所有的ServiceMonitor/PodMonitor，不用逐个打标签。
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# --- Grafana ---
grafana:
  adminPassword: "CHANGE_ME_VIA_SET"   # 用 --set grafana.adminPassword=... 传入
  resources:
    requests: { cpu: 100m, memory: 256Mi }
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: nginx      # 你P2就用ingress-nginx替换了默认Traefik
    hosts:
      - grafana.homelab.local    # 跟app.homelab.local/api.homelab.local同一套域名习惯

# --- Alertmanager：通过 Gmail SMTP 发邮件 ---
# 把 YOUR_GMAIL@gmail.com 替换成你的 Gmail 地址（共 3 处）
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "liness.0713@gmail.com"
      smtp_auth_username: "liness.0713@gmail.com"
      smtp_auth_password: "CHANGE_ME_VIA_SET"   # 用 --set-string 传入16位应用专用密码
      smtp_require_tls: true
    route:
      receiver: gmail
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog 是"永远在触发"的心跳告警，InfoInhibitor 是抑制用的内部告警，
        # 都不该发邮件，路由到空接收器
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      - name: "null"
      - name: gmail
        email_configs:
          - to: "liness.0713@gmail.com"
            send_resolved: true

# --- 这几个组件homelab单机场景意义不大，先关掉省资源 ---
kubeEtcd:
  enabled: false     # k3s的etcd替代品(embedded)不暴露标准etcd metrics端口，装了也抓不到
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false     # k3s默认用不了标准kube-proxy指标端点(用的是简化实现)