apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: toy-infra
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-kibana-kb-http
                port:
                  number: 5601