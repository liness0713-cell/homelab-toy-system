apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-kafka
  namespace: toy-infra
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}

# strimzi.io/kraft: enabled — 用KRaft模式(不需要Zookeeper)
# 那几个replication.factor: 1/min.insync.replicas: 1 — 单节点场景下必须设成1，因为副本数不可能超过broker数量，默认值(通常是3)在单节点下会导致topic创建失败
# listeners里先用最简单的plain/无TLS配置，方便你先跑通链路，加密/认证以后需要时再加
# 没写kafka.replicas——这是新版Strimzi的写法，副本数完全由上面KafkaNodePool的replicas字段决定，Kafka这个顶层对象不再重复声明


# Kafka CR的副本因子也一并调整——这次因为凑齐了3个broker,可以用生产环境更常见的配置
# 命令说明：min.insync.replicas: 2这次可以放心设为2了（而不是2副本时保守的1）——3副本情况下,
# 即使1个broker挂掉,剩下2个还能满足"至少2个确认写入"的要求,集群依然能正常写入,
# 这正是quorum（多数派）容错的体现,允许1台故障还能撑住。