apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: toy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      terminationGracePeriodSeconds: 35
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "low-power"
          effect: "NoSchedule"
      containers:
        - name: gateway-service
          image: localhost:5000/gateway-service:202609220927-ef81920
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: jwt-secret
          env:
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - gateway-service    # 换成你实际的app标签值
            topologyKey: kubernetes.io/hostname