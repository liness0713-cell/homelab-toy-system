apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: toy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: notification-service
          image: localhost:5000/notification-service:202608291813-b836314
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: SERVER_PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20