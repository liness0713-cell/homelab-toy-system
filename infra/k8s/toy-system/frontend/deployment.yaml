apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: toy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "low-power"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: localhost:5000/frontend:202608291813-b836314
          ports:
            - containerPort: 80