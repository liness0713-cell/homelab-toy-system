name: toy-system   # 固定死项目名，不管你在哪个目录执行 docker compose，都用这个

# 本地开发环境中间件。业务服务不在这里跑（用 mvn spring-boot:run / npm run dev 直接跑，方便调试）。
# P1: MySQL + Redis。P3: 加了Kafka（KRaft单节点）。P4: 加了Elasticsearch + Kibana。
# P6: 加了mysqld-exporter/redis-exporter。ES/Kafka已迁移到k3s（toy-infra namespace），
#     这里的es/kafka/kibana/kafka-ui加了profile，默认`docker compose up -d`不会启动它们，
#     只有明确需要本地调试时才用 `docker compose --profile legacy-streaming up -d` 拉起。
services:
  mysql:
    image: mysql:8.4
    container_name: toy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: toy_policy_db
      MYSQL_USER: toy_app
      MYSQL_PASSWORD: toy_app_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: toy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # bitnami/kafka 的免费tag在2025年的Bitnami镜像调整后已经下架，改用官方 apache/kafka 镜像
    # （Kafka 3.7+ 官方开始发布，原生支持KRaft，不用再额外装Zookeeper）。
    image: apache/kafka:4.2.1
    container_name: toy-kafka
    restart: unless-stopped
    profiles: ["legacy-streaming"]   # 已迁移到k3s，默认不启动
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 原来只有一个对外PLAINTEXT监听器，因为当时只有宿主机上的业务服务要连Kafka。
      # 现在加了跑在compose网络里的kafka-ui，它需要通过容器间网络（服务名`kafka`）访问，
      # 不能用"localhost:9092"这个只对宿主机有效的地址——所以拆成两个监听器：
      # PLAINTEXT_HOST 给宿主机上的服务用，PLAINTEXT_INTERNAL 给同一个compose网络里的容器用。
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 踩过的坑：apache/kafka镜像默认log.dirs是/tmp/kraft-combined-logs，跟下面挂载的卷
      # 路径对不上——之前一直以为数据有持久化，其实容器一旦被recreate（不是简单重启）,
      # /tmp下的数据就没了。显式把log.dirs指到卷挂载的路径上，两者才是真的对应上。
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    # provectuslabs/kafka-ui 已经停更（最后一个版本停在2024年4月），项目转交给了社区维护的
    # kafbat/kafka-ui，这里用这个还在活跃更新的fork。只是可视化工具，不是业务依赖。
    image: kafbat/kafka-ui:v1.5.0
    container_name: toy-kafka-ui
    restart: unless-stopped
    profiles: ["legacy-streaming"]   # 依赖kafka服务，同样默认不启动
    ports:
      # 用9090而不是8080/8081/8082...这个连续区间——那段留给gateway-service/policy-service/
      # notification-service/以后的search-service等业务服务用，这里特意避开。
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # 走内部监听器 PLAINTEXT_INTERNAL（kafka:29092），因为这个UI本身跑在compose网络里，
      # 不是宿主机上的服务，不能用"localhost:9092"那个只对宿主机有效的地址。
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    container_name: toy-elasticsearch
    restart: unless-stopped
    profiles: ["legacy-streaming"]   # 已迁移到k3s（ECK），默认不启动
    environment:
      discovery.type: single-node
      # 本地开发简化：关掉需要TLS证书+账号密码的安全模块，不然本地起一个ES还要先搞证书。
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.19
    container_name: toy-kibana
    restart: unless-stopped
    profiles: ["legacy-streaming"]   # 依赖elasticsearch服务，同样默认不启动
    environment:
      # Kibana自己跑在compose网络里，用容器名访问ES；跟kafka-ui访问kafka是同一个道理。
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

#在harbor引入之前，用来给k3s传递镜像
  registry:
    image: registry:2
    container_name: local-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  mysqld-exporter:
    image: prom/mysqld-exporter
    container_name: mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD}"
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"

volumes:
  mysql-data:
  kafka-data:
  es-data:
  registry-data:

# 关键改动：给默认网络显式指定一个固定名字，不再依赖"执行docker compose时所在目录"
# 去推导网络名——这正是这次mysqld-exporter/redis-exporter和mysql/redis被分到两个网络
# (docker-compose_default / infra_default)的根因。以后不管从哪个目录执行
# `docker compose -f 这份文件 up -d`，都会稳定连到同一个叫toy-infra-net的网络上。
networks:
  default:
    name: toy-infra-net
    external: true   # 这个网络已经在Step 2用 `docker network create` 手动建过了，
                      # 加external告诉compose直接复用，不要自己再建一份同名的