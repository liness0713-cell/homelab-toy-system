server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 用ErrorHandlingDeserializer包一层：反序列化失败（比如遇到脏消息）时把异常放进record交给
      # 容器的错误处理器处理，而不是直接从Kafka客户端里抛出来——DefaultErrorHandler处理不了
      # 后一种情况，会导致consumer卡在同一条消息上死循环重试，永远消费不下去。
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.toysystem.notification.event
        spring.json.value.default.type: com.toysystem.notification.event.PolicyEvent
        # policy-service的JsonSerializer默认会把它自己的类名（com.toysystem.policy.event.PolicyEvent）
        # 写进__TypeId__头；不同服务的类名本来就不该耦合，这里直接让consumer无视这个头，
        # 永远用上面配置的 default.type 反序列化。
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.toysystem.notification: DEBUG
