server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: policy-service
          uri: ${POLICY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/policies/**

toy-system:
  jwt:
    secret: ${JWT_SECRET:toy-system-dev-secret-key-please-change-me-in-prod-0001}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # 应用级CORS（见 config/CorsConfig.java），覆盖网关本地接口(/auth/**)和代理路由(/api/**)。
    # localhost 和 127.0.0.1 在浏览器眼里是两个不同的origin，本地开发时都放开，
    # 避免因为访问地址写法不同（比如复制的链接用了127.0.0.1）就莫名其妙CORS报错。
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:5173}
      - ${CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.toysystem.gateway: DEBUG
